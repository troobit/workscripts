# Template — copy into a target repo's .github/workflows/ and set the repo
# variables/secrets listed below. Imported from sanarte's update-kv-secret.yml.
#
# Required repo variables:
#   AZ_CLIENT_ID        client ID of the user-assigned managed identity (OIDC federated)
#   AZ_TENANT_ID        Entra ID tenant ID
#   AZ_SUBSCRIPTION_ID  target subscription ID
#   AZ_KEYVAULT_NAME    Key Vault holding the registry-pull secret
# Required repo secret:
#   GHCR_PAT            PAT with read:packages, stored as the cr-password secret
#                       that the Container App's registry block references
#
# Changes from the source: auth switched from secrets.AZURE_* to the same repo
# vars the other three templates use, and the workflow_run trigger now names
# "Infrastructure Deployment" (tf-deploy.yml) — the source referenced a
# workflow name that no longer existed.
name: Update Azure Key Vault Secrets
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Infrastructure Deployment"]
    types:
      - completed

permissions:
  id-token: write
  contents: read

jobs:
  update-kv:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    name: "Update Azure Key Vault Secrets"
    permissions:
      id-token: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZ_CLIENT_ID }}
          tenant-id: ${{ vars.AZ_TENANT_ID }}
          subscription-id: ${{ vars.AZ_SUBSCRIPTION_ID }}
          allow-no-subscriptions: true

      - name: Update KV Secrets
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            az keyvault secret set \
            --name "cr-password" \
            --vault-name "${{ vars.AZ_KEYVAULT_NAME }}" \
            --value ${{ secrets.GHCR_PAT }}
