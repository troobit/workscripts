# skup.conf — tag -> repo-set config for the `skup` command.
#
# Format: line-oriented `key = value`. The value is everything after the first
# `=`, trimmed. Full-line `#` comments only (a `#` inside a value is kept).
#
#   default        the set opened by bare `skup`
#   tag.<name>     the set opened by `skup <name>`
#   cmd.<repo>     override the detected start command; an empty value means
#                  shell-only (no server, no detection)
#   repos_root     where repos live; a leading ~ is expanded to $HOME
#
# Start command when cmd.<repo> is absent: `make dev` if the Makefile has a
# `dev:` target, else `pnpm dev` if package.json declares a `dev` script, else
# shell-only.

default = sdd-ui rtob siteme

tag.feature = sdd-ui rtob
tag.billing = toes finance
tag.client  = sanarte brandme

cmd.toes    = make web
cmd.brandme =

repos_root  = ~/repos
